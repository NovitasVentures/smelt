[meta]
name     = "demo7_sensor"
language = "cpp"
std      = "c++14"
version  = "1.0"

[thresholds]
compliance = 0.90
goal       = 1.00
mutation   = 0.60

[iterations]
max = 10

[scorers]
# Two Crasis specialists verified and re-enabled:
#   platform-dependent-integer-types: 97.3% synthetic accuracy, 6/6 C++ verification
#   output-param-written-before-error-check: 95.7% synthetic accuracy, 6/6 C++ verification
# One specialist excluded: output-param-written-on-error-path — the concept requires
# understanding control-flow ordering, which is beyond the BERT-L2 model capacity.
# Real-example training (35 examples) could not produce a model that generalises to
# unseen clean C++ functions — model classifies all ErrorCode+output-param functions
# as positive regardless of write ordering. Kept in crasis config but not in
# mandatory_principles so it contributes to score without being a hard block.
active  = ["clang_tidy", "crasis", "layer"]
weights = { clang_tidy = 0.20, crasis = 0.40, layer = 0.40 }

[scorers.clang_tidy]
checks = "cppcoreguidelines-*,modernize-*,readability-*"

[scorers.crasis]
models_dir           = "demo/sensor/specialists"
confidence_threshold = 0.85
active_specialists   = [
  "output-param-written-before-error-check",
  "platform-dependent-integer-types",
]
mandatory_principles = [
  "output-param-written-before-error-check",
  "platform-dependent-integer-types",
]

[scorers.layer]
layers   = ["hal", "processing", "application"]
allowed  = [
  { from = "processing",  to = "hal" },
  { from = "application", to = "processing" },
]
mandatory = true

[runners]
framework = "gtest"
build     = "cmake"
build_dir = "build/"

[mutator]
engine = "mutate++"
