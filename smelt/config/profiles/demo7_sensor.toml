[meta]
name     = "demo7_sensor"
language = "cpp"
std      = "c++14"
version  = "1.0"

[thresholds]
compliance = 0.90
goal       = 1.00
mutation   = 0.60

[iterations]
max = 10

[scorers]
# Crasis disabled: the output-param specialists were built but ONNX export failed
# for one, and the two that exported have systematic false positives on C++ code
# (both clean and violating implementations score positive at 95%+ confidence).
# The specialists need a rebuild with corrected C++ training data before re-enabling.
# The demo primary claim — LayerScorer catching systemic layer drift — is unaffected.
active  = ["clang_tidy", "layer"]
weights = { clang_tidy = 0.30, layer = 0.70 }

[scorers.clang_tidy]
checks = "autosar-*,cppcoreguidelines-*,modernize-*,readability-*"

[scorers.crasis]
models_dir           = "demo/sensor/specialists"
confidence_threshold = 0.85
active_specialists   = [
  "output-param-written-before-error-check",
  "output-param-written-on-error-path",
  "platform-dependent-integer-types",
]
mandatory_principles = [
  "output-param-written-before-error-check",
  "output-param-written-on-error-path",
  "platform-dependent-integer-types",
]

[scorers.layer]
layers   = ["hal", "processing", "application"]
allowed  = [
  { from = "processing",  to = "hal" },
  { from = "application", to = "processing" },
]
mandatory = true

[runners]
framework = "gtest"
build     = "cmake"
build_dir = "build/"

[mutator]
engine = "mutate++"
