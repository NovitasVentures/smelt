[meta]
name     = "demo8_bms"
language = "cpp"
std      = "c++14"
version  = "1.0"

[thresholds]
compliance = 0.90
goal       = 1.00
mutation   = 0.60

[iterations]
max = 15   # Demo 4b needed 13 under pure architectural pressure

[scorers]
active  = ["clang_tidy", "crasis", "layer"]
weights = { clang_tidy = 0.20, crasis = 0.40, layer = 0.40 }

[scorers.clang_tidy]
# AUTOSAR C++14-aligned ruleset. Upstream clang-tidy ships no autosar-* checks
# (verified: the glob matches zero checks on LLVM 18), so the claim is
# "AUTOSAR-aligned", never "AUTOSAR certified". hicpp (High Integrity C++),
# cert, and cppcoreguidelines are the closest published supersets of the
# AUTOSAR C++14 guidance. If iteration-1 clang-tidy detail drowns the
# architectural failure detail in reprompts, trim readability-* first.
#
# bugprone-easily-swappable-parameters excluded (2026-07-05, run 20260705_205805):
# its only real fix is a signature change (e.g. bundling same-typed params into
# a struct), which the black-box generator cannot verify is compatible with the
# frozen tests it cannot see. It fired every iteration on
# CellSensor::configure(cell, raw_voltage, raw_temp, ready) and twice caused a
# build-failure regression (iterations 13 and 15 of 15) when the generator
# "fixed" it by introducing a CellConfig struct, breaking the frozen tests'
# 4-argument calls. This is the exact risk the paragraph above already warns
# about — a real instance, not a hypothetical one.
checks = "hicpp-*,cert-*,cppcoreguidelines-*,bugprone-*,-bugprone-easily-swappable-parameters,modernize-*,readability-*"

[scorers.crasis]
# All five specialists trained fresh from BMS-vocabulary specs. Two of them
# (platform-dependent-integer-types, output-param-written-before-error-check)
# enforce the same English rules as Demo 7, but direct reuse of the Demo 7
# models failed verification on 2026-07-03 — the rules transferred, the
# weights didn't, so both were retrained against this project's vocabulary.
# Verification gate: every specialist must pass the full classify pass in
# demo/bms/specialist_authoring.md before smelt run. Demote any specialist
# with imperfect clean/violation separation from mandatory_principles
# (keep it in active_specialists) and record it in the build history.
#
# fault-cleared-outside-reset is a COMPOSITE principle (see [scorers.crasis.composites]
# below), not a single trained specialist. After 3 retrain rounds (capacity increase,
# label-contradiction fix, vocabulary-rebalance fix) a single BERT-Mini classifier could
# not simultaneously learn a name-conditioned exemption and a data-flow violation pattern
# without keying on identifier shortcuts (e.g. "the literal token 'update_cell' -> clean").
# Resolution (2026-07-05, hybrid decomposition): the rule's deterministic clauses are
# compiled into deterministic checks — the exact-name exemption is a signature comparison
# (exemption_signatures) and the "touches fault state at all" trigger clause is a token
# gate (trigger_patterns) — while the judgment call ("does this path actually clear
# fault state?") stays with the fault-clearing-dataflow specialist, trained on
# identifier-redacted text so it structurally cannot learn a name shortcut.
# An earlier revision used a trained reset-name-exemption specialist for the name
# check; it was retired — a BERT model doing string comparison is the wrong tier.
# See demo/bms/specialist_authoring.md for the full diagnosis and build history.
models_dir           = "demo/bms/specialists"
specs_dir            = "demo/bms/specs"
confidence_threshold = 0.85
active_specialists   = [
  "fault-cleared-outside-reset",                # composite: see [scorers.crasis.composites]
  "raw-threshold-comparison-in-decision-logic", # composite: see [scorers.crasis.composites]
  "state-mutation-in-diagnostic-query",
  "platform-dependent-integer-types",           # Demo 7 rule, retrained on BMS vocabulary (28/28)
  "output-param-written-before-error-check",    # Demo 7 rule, retrained on BMS vocabulary (23/28 — see below)
]
# output-param-written-before-error-check is NOT mandatory: verification shows
# imperfect clean/violation separation (5 false positives on spec-API
# conversion/read functions, report.md 2026-07-05). Per the demotion policy
# above it stays active (scores, appears in the trace) but cannot block
# CONVERGED. Recorded in demo/bms/specialist_authoring.md build history.
mandatory_principles = [
  "fault-cleared-outside-reset",
  "raw-threshold-comparison-in-decision-logic",
  "state-mutation-in-diagnostic-query",
  "platform-dependent-integer-types",
]

[scorers.crasis.composites.fault-cleared-outside-reset]
# A chunk violates this composite principle iff it passes the trigger gate, is not
# name-exempt, and either a deterministic tier resolves it as a violation, or
# (when no deterministic tier applies) violation_specialist fires positive.
# Trigger patterns, name exemption, and the deterministic tiers below all run
# on the UNREDACTED chunk; only the model classifies redacted text.
violation_specialist = "fault-clearing-dataflow"   # data-flow judgment, trained on redacted text
# SAD 6.2 exempts exactly these function names — a string comparison, not a
# learning problem (checked against CodeChunk.signature's method name).
exemption_signatures = ["reset_faults", "clear_faults"]
# Transcription of the rule's trigger clause: "clearing" is defined as assigning
# the literal FaultType::NONE, or delegating to a reset/clear-named routine —
# nothing else. A chunk containing neither is structurally incapable of
# clearing fault state and skips both the deterministic tiers and the model.
trigger_patterns = [
  'FaultType::NONE',                                     # the only value this rule calls "cleared"
  '\b(?:\w+_\s*\.\s*)?(?:reset|clear|fill|assign)\w*\s*\(',  # clearing-idiom call, bare or member-qualified
]
#
# --- Deterministic tiers (2026-07-05, run 20260705_205805 findings) ---
#
# Both false positives found on real generated code turned out to be
# structural-shape questions, not data-flow judgment questions — exactly the
# kind of question redaction makes UNLEARNABLE rather than merely hard,
# because it erases the one thing (identifier role: member vs. local,
# specific call name) the question actually turns on:
#
# 1. delegation_call_patterns: does a reset/clear-prefixed call sit alone in
#    the body (clean delegation) or is it followed by further work (violation
#    — reinit-before-evaluate)? The ONLY textual difference between
#    neg__poll_cell (clean) and pos__shape7 (violation) is the presence of a
#    single `fault_manager_.reset_faults();` call; the model persistently
#    misclassified neg__poll_cell because after redaction this is a
#    control-flow-shape question with no data-flow content left to judge.
#    Fixed as a deterministic check (`_delegation_call_verdict`) rather than
#    more training examples — build 8 already tried that and made the false
#    positive worse, not better (see specialist_authoring.md).
# 2. cleared_value_patterns: is FaultType::NONE assigned to a MEMBER (trailing
#    underscore, direct/indexed/range-loop) or to a local variable? After
#    redaction, `MEMBER_0 = FaultType::NONE` and
#    `FaultType current = FaultType::NONE` (a local) are structurally close —
#    the model misclassified neg__shape3_query_local_init (local-only) as a
#    violation once the trigger gate was tightened enough to let it reach the
#    model at all. The member/local distinction is a hard structural fact
#    (the chunker's own trailing-underscore convention), not a learned one.
#
# Measured against the full 28-case verification suite, these two tiers plus
# the exemption/trigger gates above resolve every case correctly except one
# constructor shape the production chunker filters out before it ever reaches
# any scorer (see verify.py's production_chunks doc) — i.e. the deterministic
# path alone reproduces (and on real generated code, exceeds) 8 build rounds'
# worth of model accuracy. The model is kept as the fallback for any chunk
# neither deterministic tier resolves (there are currently none in the known
# shape catalog) rather than removed outright, since a generated codebase can
# still produce a genuinely novel shape the hand-authored suite didn't
# anticipate.
redaction_preserve_prefixes = ["reset", "clear"]   # rule vocabulary must survive redaction for the model fallback
delegation_call_patterns = [
  '\b(?:\w+_\s*\.\s*)?(?:reset|clear)\w*\s*\([^)]*\)\s*;',
]
cleared_value_patterns = ["FaultType::NONE"]
redact_for_violation = true                        # redact chunk text before classify() with violation_specialist (fallback only)

[scorers.crasis.composites.raw-threshold-comparison-in-decision-logic]
# Gate-only composite (no exemption tier): the rule's own definition is "a
# raw-flavored identifier participates in a COMPARISON against a literal or
# threshold constant" — never an assignment. The end-to-end run on
# 2026-07-05 (run 20260705_205805) found CellSensor::configure
# (raw_voltage_.at(cell) = raw_voltage; — assignment only, zero comparison
# operators) scoring 0.71-0.95 positive depending on incidental indexing
# style ([] vs .at()), confirmed by direct classify() to be keyed on
# surface "raw-flavored identifier near array indexing" rather than the
# actual comparison the rule requires. A pure-assignment body is
# structurally incapable of a threshold comparison and never reaches the
# model. This does not touch the model's separate "is this a conversion/HAL
# function" name judgment (verified clean, 25/25) — comparisons inside
# to_millivolts/to_deci_celsius still gate in and are still classified
# exactly as before.
violation_specialist = "raw-threshold-comparison-in-decision-logic"
trigger_patterns = [
  '\b\w*(?:raw|counts)\w*\b\s*(?:>=|<=|==|!=|>|<)',   # raw-flavored identifier, then a comparison operator
  '(?:>=|<=|==|!=|>|<)\s*\b\w*(?:raw|counts)\w*\b',   # comparison operator, then a raw-flavored identifier
]

[scorers.layer]
layers  = ["hal", "monitoring", "supervision"]
allowed = [
  { from = "monitoring",  to = "hal" },
  { from = "supervision", to = "monitoring" },
]
mandatory = true

[runners]
framework = "gtest"
build     = "cmake"
build_dir = "build/"
# gtest_runner.py derives SRC_DIRS from [scorers.layer].layers (+ common),
# so hal/monitoring/supervision are all compiled correctly for this profile.

[mutator]
engine = "mutate++"
