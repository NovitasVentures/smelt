[meta]
name     = "demo8_bms"
language = "cpp"
std      = "c++14"
version  = "1.0"

[thresholds]
compliance = 0.90
goal       = 1.00
mutation   = 0.60

[iterations]
max = 15   # Demo 4b needed 13 under pure architectural pressure

[scorers]
active  = ["clang_tidy", "crasis", "layer"]
weights = { clang_tidy = 0.20, crasis = 0.40, layer = 0.40 }

[scorers.clang_tidy]
# AUTOSAR C++14-aligned ruleset. Upstream clang-tidy ships no autosar-* checks
# (verified: the glob matches zero checks on LLVM 18), so the claim is
# "AUTOSAR-aligned", never "AUTOSAR certified". hicpp (High Integrity C++),
# cert, and cppcoreguidelines are the closest published supersets of the
# AUTOSAR C++14 guidance. If iteration-1 clang-tidy detail drowns the
# architectural failure detail in reprompts, trim readability-* first.
checks = "hicpp-*,cert-*,cppcoreguidelines-*,bugprone-*,modernize-*,readability-*"

[scorers.crasis]
# Three NEW specialists trained from demo/bms/SAD.md section 6, plus two
# specialists reused unchanged from Demo 7 (copied into models_dir, not
# retrained — delete their arch-import YAMLs before arch-build).
# Verification gate: every specialist must pass the full classify pass in
# demo/bms/specialist_authoring.md before smelt run. Demote any specialist
# with imperfect clean/violation separation from mandatory_principles
# (keep it in active_specialists) and record it in the build history.
#
# fault-cleared-outside-reset is a COMPOSITE principle (see [scorers.crasis.composites]
# below), not a single trained specialist. After 3 retrain rounds (capacity increase,
# label-contradiction fix, vocabulary-rebalance fix) a single BERT-Mini classifier could
# not simultaneously learn a name-conditioned exemption and a data-flow violation pattern
# without keying on identifier shortcuts (e.g. "the literal token 'update_cell' -> clean").
# Split into reset-name-exemption (pure name/call-graph check) and fault-clearing-dataflow
# (pure data-flow check on identifier-redacted text, so it structurally cannot learn a
# name shortcut) — see demo/bms/specialist_authoring.md for the full diagnosis.
models_dir           = "demo/bms/specialists"
specs_dir            = "demo/bms/specs"
confidence_threshold = 0.85
active_specialists   = [
  "fault-cleared-outside-reset",                # composite: see [scorers.crasis.composites]
  "raw-threshold-comparison-in-decision-logic",
  "state-mutation-in-diagnostic-query",
  "platform-dependent-integer-types",           # reused (Demo 7: 97.3%, 6/6 C++)
  "output-param-written-before-error-check",    # reused (Demo 7: 95.7%, 6/6 C++)
]
mandatory_principles = [
  "fault-cleared-outside-reset",
  "raw-threshold-comparison-in-decision-logic",
  "state-mutation-in-diagnostic-query",
  "platform-dependent-integer-types",
  "output-param-written-before-error-check",
]

[scorers.crasis.composites.fault-cleared-outside-reset]
# A chunk violates this composite principle iff violation_specialist fires positive
# AND exemption_specialist does NOT fire positive on the same (unredacted) chunk.
violation_specialist = "fault-clearing-dataflow"   # data-flow only, trained on redacted text
exemption_specialist = "reset-name-exemption"      # name/call-graph only, trained on raw text
redact_for_violation = true                        # redact chunk text before classify() with violation_specialist

[scorers.layer]
layers  = ["hal", "monitoring", "supervision"]
allowed = [
  { from = "monitoring",  to = "hal" },
  { from = "supervision", to = "monitoring" },
]
mandatory = true

[runners]
framework = "gtest"
build     = "cmake"
build_dir = "build/"
# gtest_runner.py derives SRC_DIRS from [scorers.layer].layers (+ common),
# so hal/monitoring/supervision are all compiled correctly for this profile.

[mutator]
engine = "mutate++"
