crasis_spec: v1
name: shared-core-dry
description: Logic that bridges two or more applications must be abstracted into a
  shared architectural core. Data schemas (e.g., the Order object), Error codes, and
  standard Response envelopes must be imported from the coffeeloop-core library.
task:
  type: binary_classification
  trigger: A data schema, error code, or response envelope that is used across multiple
    applications is defined locally within a service module instead of being imported
    from the coffeeloop-core library.
  ignore: Service-specific data structures that are only used within a single application.
    Private internal classes that are not shared. Test fixtures and mock objects.
constraints:
  max_model_size_mb: 20
  max_inference_ms: 10
  connectivity: none
quality:
  min_accuracy: 0.93
  eval_on:
  - 'class Order: pass  # in order_gateway/models.py - should flag if Order is also
    in inventory_manager'
  - 'from coffeeloop_core.schemas import Order  # Correct import pattern'
  - 'ERROR_OUT_OF_STOCK = ''E001''  # Defined in service file - violation if used
    cross-service'
  - 'from coffeeloop_core.errors import ERROR_OUT_OF_STOCK  # Correct pattern'
  - 'class InternalQueueBuffer: pass  # Service-specific, not shared - acceptable'
training:
  strategy: synthetic
  volume: 3000
_smelt_meta:
  source_section: '6.2'
  chunk_level: file
  weight: 1.0
  mandatory: true
