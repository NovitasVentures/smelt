[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smelt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "ruff>=0.4",
    "mutmut==2.5.1",
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6",
    "crasis>=1.3",
]

[project.optional-dependencies]
dev = ["mypy", "black"]

[project.scripts]
smelt = "smelt.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["smelt*"]
